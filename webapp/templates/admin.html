<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uchiro Store — Admin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600;700;800&family=Noto+Sans+Khmer:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#06070c; --card:#12141f; --line:rgba(255,255,255,.08);
    --gold-1:#ffe9a8; --gold-2:#e8c766; --blue:#4fd1ff; --cloud:#f2f3f7;
    --muted:#868c9e; --warranty:#35d68a; --danger:#ff5c6c;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--cloud); font-family:'Poppins','Noto Sans Khmer',sans-serif;
    padding:16px 14px 60px;}
  h1{font-family:'Anton',sans-serif; letter-spacing:1px; font-size:22px;
    background:linear-gradient(180deg, var(--gold-1), var(--gold-2)); -webkit-background-clip:text;
    background-clip:text; color:transparent; margin:6px 0 2px;}
  .sub{ color:var(--muted); font-size:12px; margin-bottom:16px; }
  .tabs{ display:flex; gap:8px; margin-bottom:16px; }
  .tab{ flex:1; text-align:center; padding:10px; border-radius:12px; background:var(--card); border:1px solid var(--line);
    font-size:13px; font-weight:600; color:var(--muted); cursor:pointer; }
  .tab.active{ color:var(--gold-1); border-color:var(--gold-2); background:rgba(232,199,102,.1); }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:10px; }
  .row{ display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .name{ font-weight:600; font-size:13.5px; flex:1; }
  .meta{ font-size:11px; color:var(--muted); margin-top:3px; }
  input, select, textarea{ background:#0b0d16; border:1px solid var(--line); color:var(--cloud); border-radius:8px;
    padding:8px 10px; font-size:13px; font-family:inherit; width:100%; }
  .field{ margin-bottom:10px; }
  .field label{ font-size:11px; color:var(--muted); display:block; margin-bottom:4px; }
  .inline-edit{ display:flex; gap:6px; align-items:center; margin-top:8px; }
  .inline-edit input{ width:70px; text-align:center; }
  .btn{ border:none; border-radius:10px; padding:8px 14px; font-size:12px; font-weight:700; cursor:pointer; }
  .btn.primary{ color:#06070c; background:linear-gradient(135deg, var(--blue), #8be9ff); }
  .btn.gold{ color:#06070c; background:linear-gradient(135deg, var(--gold-1), var(--gold-2)); }
  .btn.danger{ color:#fff; background:var(--danger); }
  .btn.ghost{ color:var(--muted); background:transparent; border:1px solid var(--line); }
  .btn.small{ padding:6px 10px; font-size:11px; }
  .badge{ font-size:10px; font-weight:700; padding:3px 8px; border-radius:7px; }
  .badge.on{ background:rgba(53,214,138,.15); color:var(--warranty); }
  .badge.off{ background:rgba(255,92,108,.15); color:var(--danger); }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .msg{ text-align:center; padding:40px 10px; color:var(--muted); font-size:13px; }
  .thumb-sm{ width:44px; height:44px; border-radius:8px; object-fit:cover; background:#0b0d16; flex-shrink:0; }
</style>
</head>
<body>

<h1>UCHIRO ADMIN</h1>
<div class="sub" id="whoami">កំពុងផ្ទៀងផ្ទាត់...</div>

<div id="app" style="display:none;">
  <div class="tabs">
    <div class="tab active" data-tab="items">📦 ទំនិញ</div>
    <div class="tab" data-tab="add">➕ បន្ថែម</div>
    <div class="tab" data-tab="orders">🧾 Order</div>
  </div>

  <div id="tabItems"></div>

  <div id="tabAdd" style="display:none;">
    <div class="card">
      <div class="field"><label>ប្រភេទ</label>
        <select id="f_category">{% for c in categories %}<option>{{ c }}</option>{% endfor %}</select></div>
      <div class="field"><label>ឈ្មោះ</label><input id="f_name" placeholder="ឧ. East Dragon"></div>
      <div class="grid2">
        <div class="field"><label>តម្លៃ ($)</label><input id="f_price" type="number" step="0.01"></div>
        <div class="field"><label>ស្តុក</label><input id="f_quantity" type="number" value="1"></div>
      </div>
      <div class="field"><label>ពិពណ៌នា</label><textarea id="f_description" rows="2"></textarea></div>
      <div class="field"><label>ព័ត៌មានប្រគល់ជូន (Login/Password)</label><textarea id="f_delivery" rows="2"></textarea></div>
      <div class="field"><label>Warranty (ថ្ងៃ, Account=14, ផ្សេង=0)</label><input id="f_warranty" type="number" value="0"></div>
      <div class="field"><label>រូបភាព</label><input id="f_photo" type="file" accept="image/*"></div>
      <button class="btn gold" id="submitAddBtn" style="width:100%;">✅ រក្សាទុក</button>
    </div>
  </div>

  <div id="tabOrders"></div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const initData = tg?.initData || '';
let isAdmin = false;

async function verify(){
  try{
    const res = await fetch('/api/admin/verify', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({init_data: initData})});
    const data = await res.json();
    isAdmin = data.is_admin;
    if (isAdmin){
      document.getElementById('whoami').textContent = `សួស្តី ${data.name || 'Admin'}! (Verified ✅)`;
      document.getElementById('app').style.display = '';
      loadItems();
    } else {
      document.getElementById('whoami').innerHTML = '❌ អ្នកមិនមែនជា Admin ទេ ឬបើកមិនត្រឹមត្រូវ។ សូមប្រើប៊ូតុងបើក Panel ពី Admin Bot ផ្ទាល់។';
    }
  }catch(e){
    document.getElementById('whoami').textContent = '⚠️ មិនអាចផ្ទៀងផ្ទាត់បានទេ។';
  }
}

document.querySelectorAll('.tab').forEach(t=>{
  t.onclick = ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('tabItems').style.display = t.dataset.tab==='items' ? '' : 'none';
    document.getElementById('tabAdd').style.display = t.dataset.tab==='add' ? '' : 'none';
    document.getElementById('tabOrders').style.display = t.dataset.tab==='orders' ? '' : 'none';
    if (t.dataset.tab === 'orders') loadOrders();
  };
});

async function loadItems(){
  const box = document.getElementById('tabItems');
  box.innerHTML = '<div class="msg">កំពុងផ្ទុក...</div>';
  const res = await fetch(`/api/admin/items?init_data=${encodeURIComponent(initData)}`);
  const data = await res.json();
  if (!data.items || !data.items.length){ box.innerHTML = '<div class="msg">មិនទាន់មានទំនិញទេ</div>'; return; }
  box.innerHTML = '';
  data.items.forEach(it=>{
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `
      <div class="row">
        ${it.photo_url ? `<img class="thumb-sm" src="${it.photo_url}">` : `<div class="thumb-sm"></div>`}
        <div class="name">#${it.id} ${it.name}<div class="meta">${it.category} · ${it.active && it.quantity>0 ? '<span class="badge on">Active</span>' : '<span class="badge off">Inactive</span>'}</div></div>
      </div>
      <div class="inline-edit">
        <label style="font-size:11px;color:var(--muted);">$</label>
        <input type="number" step="0.01" value="${it.price}" data-field="price" data-id="${it.id}">
        <label style="font-size:11px;color:var(--muted);">Stock</label>
        <input type="number" value="${it.quantity}" data-field="quantity" data-id="${it.id}">
        <button class="btn primary small saveBtn" data-id="${it.id}">Save</button>
        <button class="btn danger small delBtn" data-id="${it.id}">Del</button>
      </div>`;
    box.appendChild(el);
  });
  box.querySelectorAll('.saveBtn').forEach(b=>b.onclick = ()=> saveItem(b.dataset.id));
  box.querySelectorAll('.delBtn').forEach(b=>b.onclick = ()=> deleteItem(b.dataset.id));
}

async function saveItem(id){
  const price = document.querySelector(`input[data-field="price"][data-id="${id}"]`).value;
  const quantity = document.querySelector(`input[data-field="quantity"][data-id="${id}"]`).value;
  const fd = new FormData();
  fd.append('init_data', initData);
  fd.append('price', price);
  fd.append('quantity', quantity);
  const res = await fetch(`/api/admin/items/${id}`, {method:'PATCH', body: fd});
  if (res.ok){ tg?.HapticFeedback?.notificationOccurred('success'); loadItems(); }
  else alert('មានបញ្ហា');
}

async function deleteItem(id){
  if (!confirm('លុបទំនិញនេះមែនទេ?')) return;
  const res = await fetch(`/api/admin/items/${id}?init_data=${encodeURIComponent(initData)}`, {method:'DELETE'});
  if (res.ok) loadItems(); else alert('មានបញ្ហា');
}

document.getElementById('submitAddBtn').onclick = async ()=>{
  const fd = new FormData();
  fd.append('init_data', initData);
  fd.append('category', document.getElementById('f_category').value);
  fd.append('name', document.getElementById('f_name').value);
  fd.append('price', document.getElementById('f_price').value);
  fd.append('quantity', document.getElementById('f_quantity').value);
  fd.append('description', document.getElementById('f_description').value);
  fd.append('delivery_info', document.getElementById('f_delivery').value);
  fd.append('warranty_days', document.getElementById('f_warranty').value);
  const photo = document.getElementById('f_photo').files[0];
  if (photo) fd.append('photo', photo);

  const res = await fetch('/api/admin/items', {method:'POST', body: fd});
  const data = await res.json();
  if (res.ok){
    alert('✅ បានបន្ថែម #' + data.item_id);
    document.querySelector('.tab[data-tab="items"]').click();
  } else {
    alert('❌ មានបញ្ហា: ' + (data.error || 'unknown'));
  }
};

async function loadOrders(){
  const box = document.getElementById('tabOrders');
  box.innerHTML = '<div class="msg">កំពុងផ្ទុក...</div>';
  const res = await fetch(`/api/admin/orders?init_data=${encodeURIComponent(initData)}`);
  const data = await res.json();
  if (!data.orders || !data.orders.length){ box.innerHTML = '<div class="msg">មិនទាន់មាន Order ទេ</div>'; return; }
  const icon = {pending:'⏳', approved:'✅', rejected:'❌'};
  box.innerHTML = data.orders.map(o => `
    <div class="card row">
      <div class="name">#${o.id} ${icon[o.status]||''} ${o.status}<div class="meta">@${o.buyer_username||'N/A'} · ${o.created_at}</div></div>
    </div>`).join('');
}

verify();
</script>
</body>
</html>
